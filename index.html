<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/images/encide.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENCIDE MACE</title>
    <style>
      #initial-loader {
        position: fixed;
        z-index: 10000;
        top: 0; left: 0;
        width: 100dvw; height: 100dvh;
        background-color: #0a0a0a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      .loader-rings-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 5rem; height: 5rem;
      }
      .loader-ring-1 {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border-top: 2px solid #dc2626;
        border-right: 2px solid #dc2626;
        animation: spin1 1.5s linear infinite;
      }
      .loader-ring-2 {
        position: absolute;
        inset: 0.5rem;
        border-radius: 50%;
        border-bottom: 2px solid #ef4444;
        border-left: 2px solid #ef4444;
        animation: spin2 2s linear infinite reverse;
      }
      .loader-letter {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: white;
      }
      .loader-text-group {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
      .loader-title {
        color: white;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.25em;
        font-size: 0.75rem;
        text-transform: uppercase;
        animation: pulseText 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        margin: 0;
      }
      .loader-dots-row {
        display: flex;
        gap: 0.375rem;
      }
      .loader-dot {
        width: 0.25rem; height: 0.25rem;
        border-radius: 50%;
        background-color: #ef4444;
        animation: bounceDot 1s infinite;
      }
      .ld-1 { animation-delay: 0ms; }
      .ld-2 { animation-delay: 150ms; }
      .ld-3 { animation-delay: 300ms; }

      @keyframes spin1 { to { transform: rotate(360deg); } }
      @keyframes spin2 { to { transform: rotate(-360deg); } }
      @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes bounceDot { 0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); } }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-rings-container">
        <div class="loader-ring-1"></div>
        <div class="loader-ring-2"></div>
        <div class="loader-letter">E</div>
      </div>
      <div class="loader-text-group">
        <h1 class="loader-title">Initializing</h1>
        <div class="loader-dots-row">
          <div class="loader-dot ld-1"></div>
          <div class="loader-dot ld-2"></div>
          <div class="loader-dot ld-3"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
